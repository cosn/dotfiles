onboarding = false
# Mirrors ~/.tmux.conf keybindings/theme.

[theme]
name = "catppuccin"

[keys]
prefix = "ctrl+s"

detach = "prefix+d"

focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
split_horizontal = "prefix+b"
toggle_sidebar = "prefix+t"

new_workspace = "prefix+n"       # swapped with next_tab
next_tab = "prefix+shift+n"

switch_workspace = "prefix+shift+1..9"
previous_workspace = "prefix+ctrl+p"
next_workspace = "prefix+ctrl+n"

[ui.toast]
delivery = "system"
